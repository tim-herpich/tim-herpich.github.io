<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}"
  type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

{%- comment %} https://docs.google.com/presentation/d/1rmxwWa9P6_xHqonmh5ONXRS-jPc5XKbnv99Rjkhe04s/present {% endcomment
-%}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.classList.remove('no-js');
  document.documentElement.classList.add('js');

  window.enable_copy_code_button = document.documentElement.dataset.enableCopy === "true";

  (function () {
    try {
      var pref = localStorage.getItem('theme') || 'light';
      var t = (pref === 'dark') ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.toggle('theme-dark', t === 'dark');
      document.documentElement.classList.toggle('theme-light', t === 'light');
    } catch (e) { }
  })();
</script>

<meta data-enable-copy="{{ site.enable_copy_code_button | default: false }}">

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style"
  onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css">
</noscript>

{% if site.head_scripts %}
{% for script in site.head_scripts %}
<script src="{{ script | relative_url }}"></script>
{% endfor %}
{% endif %}

<script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/sort-toggle.js' | relative_url }}" defer></script>
