{{ $alg := site.Params.fingerprintAlgorithm | default "sha512" }}
{{ range slice "projects" "cv" "collections" "blog" "software" }}
  {{ $stylesheet := resources.Get (printf "css/%s.css" .) | resources.Minify | resources.Fingerprint $alg }}
  <link rel="stylesheet" href="{{ $stylesheet.RelPermalink }}" integrity="{{ $stylesheet.Data.Integrity }}">
{{ end }}
