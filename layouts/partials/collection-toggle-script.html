<style>
  .collection-toggle {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 1.5rem 0;
  }

  .collection-toggle button {
    border: 1px solid currentColor;
    border-radius: 0.375rem;
    padding: 0.35rem 0.7rem;
  }

  .collection-toggle button.active {
    font-weight: 700;
  }

  .collection-panel {
    display: none;
  }

  .collection-panel.active {
    display: block;
  }
</style>
<script>
  document.querySelectorAll(".collection-toggle").forEach((toggle) => {
    toggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-target]");
      if (!button) return;

      toggle.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");

      const panels = toggle.parentElement.querySelectorAll(".collection-panel");
      panels.forEach((panel) => panel.classList.toggle("active", panel.id === button.dataset.target));
    });
  });
</script>
