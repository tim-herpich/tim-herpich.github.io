<script>
  document.querySelectorAll(".collection-toggle").forEach((toggle) => {
    toggle.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-target]");
      if (!button) return;

      toggle.querySelectorAll("button").forEach((item) => {
        item.classList.remove("is-active");
        item.setAttribute("aria-selected", "false");
      });
      button.classList.add("is-active");
      button.setAttribute("aria-selected", "true");

      const panels = toggle.closest(".library-page").querySelectorAll(".collection-panel");
      panels.forEach((panel) => panel.classList.toggle("is-active", panel.id === button.dataset.target));
    });
  });
</script>
