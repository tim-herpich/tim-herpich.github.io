{{ define "main" }}
<article class="library-page library-page--publications">
  <header class="library-hero">
    <p class="library-eyebrow">Publication</p>
    <h1>{{ strings.TrimSpace .Title }}</h1>
  </header>
  <ol class="collection-list">
    {{ partial "publication-item.html" . }}
  </ol>
  {{ with .Content }}<div class="prose dark:prose-invert max-w-none">{{ . }}</div>{{ end }}
</article>
{{ end }}
